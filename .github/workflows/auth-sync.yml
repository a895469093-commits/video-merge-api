name: Auth Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync AiDelly accounts -> SeaTable
        env:
          AIDELLY_KEY: ${{ secrets.AIDELLY_KEY }}
          ST_TOKEN: ${{ secrets.ST_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          SERVER = "https://3f5132d7.ridgeolares.olares.cn"
          WS = "6089152e-542a-4b80-847e-799da7f5a7e4"
          TABLE = "TikTok账号授权"

          def get(url, hdrs):
              r = urllib.request.Request(url, headers=hdrs)
              return json.load(urllib.request.urlopen(r, timeout=30))

          # 1) AiDelly 已连接 TikTok
          accs = get('https://app.aidelly.ai/api/public/v1/accounts', {
              'Authorization': 'Bearer ' + os.environ['AIDELLY_KEY'],
              'x-aidelly-workspace-id': WS})['data']['accounts']
          tiktoks = [a['username'] for a in accs if a['platform'] == 'tiktok']
          print('AiDelly tiktoks:', tiktoks)

          # 2) SeaTable auth
          au = get(SERVER + '/api/v2.1/dtable/app-access-token/',
                   {'Authorization': 'Token ' + os.environ['ST_TOKEN']})
          jwt, du = au['access_token'], au['dtable_uuid']
          H = {'Authorization': 'Bearer ' + jwt, 'Content-Type': 'application/json'}
          base = SERVER + '/api-gateway/api/v2/dtables/' + du

          # 3) 读现有行
          rows = get(base + '/rows/?table_name=' + urllib.parse.quote(TABLE) + '&convert_keys=True', H).get('rows') or []
          in_table = set(str(r.get('账号名称') or '').strip().lstrip('@') for r in rows if (r.get('账号名称') or '').strip())
          print('rows in table:', len(rows))

          # 4) 同步状态 + 新账号回填
          updates = []
          for r in rows:
              name = str(r.get('账号名称') or '').strip().lstrip('@')
              if not name:
                  continue
              ok = name in tiktoks
              if r.get('授权状态') != ('已授权' if ok else '未授权'):
                  updates.append({'row_id': r['_id'], 'row': {'授权状态': '已授权' if ok else '未授权'}})
          for name in tiktoks:
              if name in in_table:
                  continue
              empty = next((r for r in rows if not (r.get('账号名称') or '').strip()), None)
              if empty:
                  updates.append({'row_id': empty['_id'], 'row': {'账号名称': name, '授权状态': '已授权'}})
                  rows.remove(empty)
                  print('filled empty row:', name)
              else:
                  body = {'table_name': TABLE, 'rows': [{'账号名称': name, '授权状态': '已授权'}]}
                  req = urllib.request.Request(base + '/rows/', data=json.dumps(body).encode(), method='POST')
                  for k, v in H.items(): req.add_header(k, v)
                  print('appended:', name, urllib.request.urlopen(req, timeout=30).status)
          if updates:
              req = urllib.request.Request(base + '/rows/', data=json.dumps({'table_name': TABLE, 'updates': updates}).encode(), method='PUT')
              for k, v in H.items(): req.add_header(k, v)
              print('updated rows:', urllib.request.urlopen(req, timeout=30).status)
          print('SYNC DONE')
          PYEOF

      - name: Write status file
        env:
          AIDELLY_KEY: ${{ secrets.AIDELLY_KEY }}
        run: |
          curl -fsSL -H "Authorization: Bearer $AIDELLY_KEY" \
            -H "x-aidelly-workspace-id: 6089152e-542a-4b80-847e-799da7f5a7e4" \
            https://app.aidelly.ai/api/public/v1/accounts -o /tmp/acc.json
          mkdir -p outputs
          python3 -c "
          import json
          d = json.load(open('/tmp/acc.json'))
          tiks = [a['username'] for a in d['data']['accounts'] if a['platform']=='tiktok']
          json.dump({'tiktok': tiks, 'ts': __import__('time').strftime('%Y-%m-%d %H:%M:%S UTC')}, open('outputs/auth-status.json','w'))
          print(tiks)
          "
          git config user.name "sync-bot" && git config user.email "bot@users.noreply.github.com"
          git add outputs || true
          git commit -m "update auth status" || echo "no change"
          git pull --rebase || true
          git push || echo "push skip"
